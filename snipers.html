  if (box) {
    const ids = draft.pools[box.dataset.pool], id = b.dataset.id, i = ids.indexOf(id);
    if (i >= 0) { if (ids.length > 1 || box.dataset.pool === 'mods') ids.splice(i, 1); } else ids.push(id);
    syncMenu(); return;
  }
  const seg = b.closest('.seg[data-key]');
  if (seg) {
    const k = seg.dataset.key, v = b.dataset.v;
    draft[k] = typeof DEFAULTS[k] === 'number' ? +v : v;
    syncMenu();
  }
});
menuEl.addEventListener('pointerdown', e => { if (e.target === menuEl) closeMenu(); });

// ---- the loop
let last = performance.now(), acc = 0, broken = false;
function frame(dt) { if (G.screen === 'title' || G.screen === 'how') { G.menuDemo = true; } }
function loop(now) {
  if (broken) return;
  // a harness can freeze the page's own clock and step G by hand
  if (G.freeze) { last = now; acc = 0; requestAnimationFrame(loop); return; }
  try {
    const rdt = Math.min(0.05, (now - last) / 1000); last = now; acc += rdt;
    let n = 0;
    while (acc >= STEP && n < 5) { frame(STEP); if (!G.paused && !G.menuOpen) G.step(STEP); acc -= STEP; n++; }
    if (n >= 5) acc = 0;
    syncTouch();
    render(G);
    requestAnimationFrame(loop);
  } catch (err) {
    broken = true; console.error(err);
    errBox.hidden = false; errBox.textContent = 'Something broke: ' + err.message + ' (reload to keep playing)';
  }
}
addEventListener('resize', () => render(G));
requestAnimationFrame(loop);
if (/[?&]debug\b/.test(location.search)) {
  window.floppy = G; window.floppySET = SET;
  window.floppyFn = { startMode, goTitle, hold, keyFor, openMenu, closeMenu, menuPick, overPick, render, letGo };
  window.floppyK = { BODY_H, START_X, READY_T, POINT_T, SUDDEN_T, HIP_H, SHOULDER_H, PPM, MAPS: MAPS.map(m => m.id), WEAPONS: WEAPONS.map(w => w.id), MODS: MODS.map(m => m.id) };
  window.floppyStep = n => { for (let i = 0; i < n; i++) { frame(STEP); if (!G.paused) G.step(STEP); } render(G); };
}
cv.focus({ preventScroll: true });
})();
