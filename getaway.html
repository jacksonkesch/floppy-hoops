<!doctype html>
<html lang="en">
<head>

<title>Floppy Getaway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>

<body>
<canvas id="game" tabindex="0" aria-label="Floppy Getaway game. Four floppy guys race through a level to the getaway ride. Hold a lean key to tip over, let go to hop that way. Player 1: W and E lean, R uses an item. Player 2: I and O lean, P uses an item."></canvas>
<div id="err" hidden></div>
<div id="menu" hidden>

    <div class="group"><h3>ITEMS</h3><div class="chips" data-pool="items"></div></div>
    <div class="foot"><button id="done">DONE</button><span class="hint">ESC TO CLOSE</span></div>
  </div>
</div>
<script src="clips.js"></script>
<script>

// ---- under the level: only the freight line needs anything (the track rushing by under the train) ----
function drawUnder(G) {
  if (G.M.theme !== 'rail') return;
  const L = CAMX - HW / PPM - 1, R = CAMX + HW / PPM + 1, lo = CAMY - HH / PPM - 1;
  wb(L, lo, R, -0.6, '#e2bf85'); seam(L, R, -0.6, '#f0d6a4');
  wb(L, -0.6, R, -0.16, '#8f8272'); seam(L, R, -0.6, '#a89a88');
  const off = (G.t * 9) % 1.3;   // slow enough that the sleepers slide instead of strobing
  for (let x = Math.floor(L / 1.3) * 1.3 - off; x < R; x += 1.3) wb(x, -0.4, x + 0.32, -0.16, '#5e4a3a');
  wb(L, -0.16, R, 0, '#c3c8d2'); wb(L, -0.16, R, -0.1, '#7c8291');
}
function drawWater(G) {
  const M = G.M; if (M.water == null) return;
  const y = Math.round(AY(M.water)), meadow = M.theme === 'meadow';
  if (y > HH + 2) return;
  const g = ctx.createLinearGradient(0, y, 0, y + 70);
  g.addColorStop(0, meadow ? 'rgba(80,170,230,0.84)' : 'rgba(40,135,210,0.84)'); g.addColorStop(1, meadow ? 'rgba(20,80,150,0.94)' : 'rgba(10,50,110,0.94)');
  ctx.fillStyle = g; ctx.fillRect(-HW - 2, y, HW * 2 + 4, HH * 2 + 4);
  drawMirror(G, M.water, 0.32, () => ctx.rect(-HW - 2, y, HW * 2 + 4, HH - y + 2));   // racers mirrored on the surface
  ctx.fillStyle = 'rgba(225,246,255,0.9)'; ctx.fillRect(-HW - 2, y, HW * 2 + 4, 1);
  const sc = CAMX * PPM;
  for (let r = 0; r < 4; r++) {   // glints drifting at different speeds, fainter with depth
    const yy = y + 4 + r * 7 + (r & 1) * 2, per = 18 + r * 6, sp = 1.5 + r * 0.7;
    ctx.fillStyle = r === 0 ? 'rgba(200,236,255,0.75)' : `rgba(150,210,250,${(0.45 - r * 0.08).toFixed(2)})`;
    for (let x = -HW - (sc % per) - per; x < HW + per; x += per) ctx.fillRect(Math.round(x + Math.sin(G.t * sp + x * 0.3 + r) * 3), yy, 5 + r * 2, 1);
  }
}

// ---- the getaway ride (what you're racing to) and the goal marker
// a closed outline from world-space points: [x, y] is a corner, [cx, cy, x, y] bends through a control point
function trace(pts) {
  ctx.beginPath();
  pts.forEach((p, i) => { if (!i) ctx.moveTo(px(p[0]), py(p[1])); else if (p.length === 2) ctx.lineTo(px(p[0]), py(p[1])); else ctx.quadraticCurveTo(px(p[0]), py(p[1]), px(p[2]), py(p[3])); });
  ctx.closePath();
}
// a curved hull: flat fill, whatever paint() draws cut to its outline, then one ink line round it
function shell(pts, col, paint) {
  trace(pts); ctx.fillStyle = col; ctx.fill();
  if (paint) { ctx.save(); ctx.clip(); paint(); ctx.restore(); trace(pts); }
  ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.lineJoin = 'round'; ctx.stroke();
}

}
function drawHUD(G) {

  } else drawScores(G, 3, 3, G.P);

  } else { drawMine(G, G.P[0], 3, 148); drawMine(G, G.P[1], 283 - (G.P[1].item ? 0 : 30), 148); }
  // first-round reminder of the controls
  if (!G.demo && G.round === 0 && (G.state === 'ready' || (G.state === 'run' && G.stateT < 4))) {
    const a = G.state === 'ready' ? 1 : clamp(4 - G.stateT, 0, 1); ctx.globalAlpha = a;
    if (G.mode === '2p') { txt('P1: HOLD W / E TO LEAN, LET GO TO HOP, R ITEM', 160, 132, 5, CREAM); txt('P2: HOLD I / O TO LEAN, LET GO TO HOP, P ITEM', 160, 140, 5, CREAM); }
    else { txt(G.touch ? 'HOLD LEFT / RIGHT SIDE TO LEAN, LET GO TO HOP' : 'HOLD W / E TO LEAN, LET GO TO HOP', 160, 132, 6, CREAM); txt(G.touch ? 'TAP THE MIDDLE TO USE AN ITEM' : 'R USES YOUR ITEM', 160, 141, 6, CREAM); }
    ctx.globalAlpha = 1;
  }
  if (G.touch && G.screen === 'play') { rr(300, 3, 17, 13, INK); rr(301, 4, 15, 11, '#2a2534'); rr(306, 7, 2, 5, CREAM); rr(310, 7, 2, 5, CREAM); }
}

const MENU_ITEMS = [
  { id: 'cpu', label: '1 PLAYER' }, { id: '2p', label: '2 PLAYERS' }, { id: 'cvc', label: 'CPU VS CPU' }, { id: 'tt', label: 'TIME TRIAL' },
  { id: 'customize', label: 'CUSTOMIZE' }, { id: 'how', label: 'HOW TO PLAY' }, { id: 'switch', label: 'ALL GAMES' },
];
const MENU_X = 14, MENU_W = 104, MENU_Y0 = 54, MENU_DY = 12, MENU_H = 10;
const menuRect = i => ({ x: MENU_X, y: MENU_Y0 + i * MENU_DY, w: MENU_W, h: MENU_H });
function drawTitle(G) {
  const t = G.t;
  if (G.menuOpen) { ctx.fillStyle = 'rgba(8,10,18,0.5)'; ctx.fillRect(0, 0, ART_W, ART_H); return; }

    }

  });
  txt('4 FLOPPY GUYS. 1 WAY OUT.', 65, 148, fitSize('4 FLOPPY GUYS. 1 WAY OUT.', 8, 108), '#b9c3dd', { ow: 0.7 });
  txt('ARROWS OR W/S + ENTER', 65, 166, fitSize('ARROWS OR W/S + ENTER', 8, 108), '#7d88a8', { ow: 0.6 });
  // what's on: the place the demo race is running through
  txt('NOW PLAYING', 222, 163, 8, CREAM, { ow: 0.8 }); txt(G.M.name, 222, 172, 8, ORANGE, { ow: 0.8 });
}
const HELP = [
  ['RACE THE OTHER 3 FLOPPY GUYS TO THE GETAWAY.', CREAM],
  ['FIRST TO GET AWAY 3 TIMES WINS.', CREAM],
  ['', ''],
  ['HOLD A LEAN KEY: YOU TIP OVER THAT WAY.', '#ffd23a'],

  ['QUICK TAP = LITTLE HOP. LONG HOLD = BIG HOP.', '#ffd23a'],

  ['', ''],
  ['P1: W / E LEAN   R ITEM', '#ff8a8f'],
  ['P2: I / O LEAN   P ITEM', '#8ab8ff'],
  ['TOUCH: HOLD LEFT / RIGHT, TAP THE MIDDLE', '#c9bfd6'],
  ['', ''],
  ['GRAB GLOWING ITEMS. SHOOT PEOPLE OFF STUFF.', '#7fe39a'],
  ['FALL OFF AND YOU RESPAWN BACK AT THE LAST FLAG.', '#7fe39a'],
  ['', ''],
  ['ESC PAUSE   M MUTE   ANY KEY TO GO BACK', '#8a8496'],
];
function drawHelp() {
  panel(28, 8, 264, 164, 0.92); txt('HOW TO PLAY', 160, 18, 9, '#ffd23a');
  HELP.forEach(([s, c], i) => { if (s) txt(s, 160, 31 + i * 8.6, 5, c); });
}
const OVER_BTN_VS = [{ id: 'again', label: 'REMATCH', x: 92 }, { id: 'menu', label: 'MENU', x: 172 }];
const OVER_BTN_TT = [{ id: 'again', label: 'RETRY', x: 74, w: 52 }, { id: 'next', label: 'NEXT MAP', x: 134, w: 52 }, { id: 'menu', label: 'MENU', x: 194, w: 52 }];   // (three across, inside the 188-wide panel)
const overBtns = () => G.mode === 'tt' ? OVER_BTN_TT : OVER_BTN_VS;
function drawOverTT(G) {
  panel(66, 22, 188, 136, 0.92);
  txt('TIME TRIAL', 160, 34, 7, '#8f86a0'); txt(G.M.name, 160, 46, fitSize(G.M.name, 9, 176), '#7fe39a');
  txt(fmtT(G.ttT), 160, 70, 18, G.ttNew ? '#ffd23a' : CREAM);
  if (G.ttNew) { txt(Math.floor(G.t * 4) % 2 ? 'NEW RECORD!' : 'NEW RECORD! ', 160, 90, 9, '#ffd23a'); if (G.ttPrev != null) txt('OLD BEST ' + fmtT(G.ttPrev) + '  (-' + (G.ttPrev - G.ttT).toFixed(3) + ')', 160, 103, 5, '#c9bfd6'); }
  else { txt('BEST ' + fmtT(G.ttBest), 160, 90, 8, '#c9bfd6'); txt('+' + (G.ttT - G.ttBest).toFixed(3) + ' OFF YOUR BEST', 160, 103, 5, '#ff8a7a'); }
  txt('RACE YOUR GHOST: IT RUNS YOUR BEST LINE', 160, 117, 4, '#8f86a0');
}
function drawOver(G) {
  const c = G.champ; if (!c) return;
  const k = clamp(G.overT * 3, 0, 1), OVER_BTN = overBtns();
  ctx.fillStyle = `rgba(10,8,16,${0.55 * k})`; ctx.fillRect(0, 0, ART_W, ART_H);
  if (G.mode === 'tt') drawOverTT(G); else {
  panel(66, 22, 188, 136, 0.92);
  const name = crewName(G, c), line = c.human ? (G.mode === '2p' ? `${name} WINS!` : 'YOU WIN!') : `${name} WINS`;
  headIcon(c, 160, 40, 2);
  txt(line, 160, 59, fitSize(line, 14, 176), c.C.col);
  txt(c.human || G.mode === 'cvc' ? 'THE GREATEST GETAWAY ARTIST' : 'BETTER LUCK NEXT TIME', 160, 71, 5, '#c9bfd6');
  txt('GETAWAYS', 196, 81, 4, '#8f86a0'); txt('KOS', 232, 81, 4, '#8f86a0');
  const ranked = G.P.slice().sort((a, b) => b.score - a.score || (b.kos || 0) - (a.kos || 0));
  ranked.forEach((p, i) => { const y = 90 + i * 10;
    if (p === c) rr(72, y - 5, 176, 10, 'rgba(255,210,58,0.13)');
    headIcon(p, 82, y, 0.9); txt(crewName(G, p), 92, y + 0.5, fitSize(crewName(G, p), 6, 76), p.C.col, { align: 'left' });
    txt(String(p.score), 196, y + 0.5, 7, CREAM); txt(String(p.kos || 0), 232, y + 0.5, 7, CREAM); });
  }
  OVER_BTN.forEach((b, i) => {
    const sel = G.overSel === i, ok = G.overT > OVER_HOLD;
    const w = b.w || 56; rr(b.x - 1, 131, w + 2, 22, INK); rr(b.x, 132, w, 20, sel && ok ? '#2f6bd8' : '#2a2534');
    txt(b.label, b.x + w / 2, 142.5, 7, ok ? CREAM : '#6a6474');

}
function drawPause() {
  ctx.fillStyle = 'rgba(10,8,16,0.6)'; ctx.fillRect(0, 0, ART_W, ART_H);
  txt('PAUSED', 160, 74, 18, CREAM); txt('ESC OR TAP TO KEEP GOING', 160, 98, 6, '#c9bfd6'); txt('Q TO QUIT TO MENU', 160, 110, 6, '#c9bfd6');
}
function render(G) {
  resize();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#0b0d14'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(S, 0, 0, S, OX, OY); ctx.imageSmoothingEnabled = false;
  if (G.cams.length > 1) {
    const vps = [{ x: 0, y: 0, w: ART_W / 2 - 1, h: ART_H }, { x: ART_W / 2 + 1, y: 0, w: ART_W / 2 - 1, h: ART_H }];
    G.cams.forEach((c, i) => { drawView(G, c, vps[i], SPLIT_Z * (c.z || 1)); drawHurt(c.p, vps[i]); drawGoalArrow(G, c, vps[i], SPLIT_Z * (c.z || 1)); });
    rr(ART_W / 2 - 1, 0, 2, ART_H, INK);
  } else { const vp = { x: 0, y: 0, w: ART_W, h: ART_H }; const z = G.cams[0].z || 1; drawView(G, G.cams[0], vp, z); drawHurt(G.cams[0].p, vp); drawGoalArrow(G, G.cams[0], vp, z); }
  ctx.setTransform(S, 0, 0, S, OX, OY);
  if (G.screen === 'title') drawTitle(G);
  else if (G.screen === 'how') drawHelp();
  else if (!G.nohud) { drawHUD(G); drawOver(G); if (G.paused) drawPause(); }   // (nohud: the test harness wants the bare picture)
  if (SET.muted) txt('MUTED', 312, 174, 5, '#8a8496', { align: 'right' });
  // letterbox bars stay clean
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0b0d14';
  if (OX > 0) { ctx.fillRect(0, 0, Math.ceil(OX), cv.height); ctx.fillRect(Math.floor(OX + ART_W * S), 0, cv.width, cv.height); }
  if (OY > 0) { ctx.fillRect(0, 0, cv.width, Math.ceil(OY)); ctx.fillRect(0, Math.floor(OY + ART_H * S), cv.width, cv.height); }
}

// ================================================================= input
const G = new Game();
G.sfx.setMuted(!!SET.muted); G.menuOpen = false; G.overSel = 0; G.sel = 0; G.touch = false;
function goTitle() { G.screen = 'title'; G.paused = false; letGo(); G.newMatch('cvc', true); }
function startMode(mode) { G.screen = 'play'; G.overSel = 0; letGo(); G.newMatch(mode, false); cv.focus(); }
function menuPick(i) {
  const m = MENU_ITEMS[i]; if (!m) return; G.sfx.click();
  if (m.id === 'customize') openMenu();
  else if (m.id === 'how') G.screen = 'how';
  else if (m.id === 'switch') location.href = 'index.html';
  else startMode(m.id);
}
function overPick(i) { if (G.overT <= OVER_HOLD) return; G.sfx.click(); const id = overBtns()[i].id; if (id === 'again') startMode(G.mode); else if (id === 'next') { G.ttIdx = (G.ttIdx || 0) + 1; startMode('tt'); } else goTitle(); }
function keyFor(code) {
  const k = { KeyW: [0, 'L'], KeyE: [0, 'R'], KeyR: [0, 'F'], KeyI: [1, 'L'], KeyO: [1, 'R'], KeyP: [1, 'F'] }[code];
  if (k) return k;
  if (G.mode === 'cpu' || G.mode === 'tt') return { ArrowLeft: [0, 'L'], ArrowRight: [0, 'R'], ArrowUp: [0, 'F'], Space: [0, 'F'] }[code] || null;
  return null;
}
const held = new Map();
function hold(side, act, tk, down) {
  const p = G.P[side];
  if (!p || !p.human) return;
  if (down) { if (held.has(tk)) return; held.set(tk, [side, act]); } else { if (!held.has(tk)) return; held.delete(tk); }
  if (act === 'F') { p.trig = down; if (down) G.useItem(p); }
  else p.press(G, act === 'L' ? -1 : 1, down);
}
function letGo() { for (const [tk, [side, act]] of [...held]) hold(side, act, tk, false); held.clear(); }
const inRace = () => G.screen === 'play' && G.state !== 'over';
function togglePause() { if (!inRace()) return; G.paused = !G.paused; letGo(); G.sfx.click(); }
addEventListener('keydown', e => {
  G.sfx.init();
  if (G.menuOpen) { if (e.code === 'Escape') { e.preventDefault(); closeMenu(); } return; }
  if (['Space', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM' && !e.repeat) { SET.muted = SET.muted ? 0 : 1; G.sfx.setMuted(!!SET.muted); saveSettings(SET); return; }
  if (e.repeat) return;
  if (G.screen === 'how') { G.screen = 'title'; G.sfx.click(); return; }
  if (G.screen === 'title') {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') { G.sel = (G.sel + MENU_ITEMS.length - 1) % MENU_ITEMS.length; G.sfx.tick(0.6); }
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') { G.sel = (G.sel + 1) % MENU_ITEMS.length; G.sfx.tick(0.6); }
    else if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyE') menuPick(G.sel);
    else if (e.code === 'Digit1') startMode('cpu'); else if (e.code === 'Digit2') startMode('2p');
    return;
  }
  if (G.paused) { if (e.code === 'Escape' || e.code === 'Enter' || e.code === 'Space') togglePause(); else if (e.code === 'KeyQ') goTitle(); return; }
  if (G.state === 'over') {
    if (G.overT <= OVER_HOLD) return;
    if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD', 'Tab'].includes(e.code)) { e.preventDefault(); const n = overBtns().length; G.overSel = (G.overSel + (['ArrowLeft', 'KeyA'].includes(e.code) ? n - 1 : 1)) % n; G.sfx.tick(0.6); }
    else if (e.code === 'Enter' || e.code === 'Space') overPick(G.overSel);
    else if (e.code === 'Escape') goTitle();
    return;
  }
  if (e.code === 'Escape') { togglePause(); return; }
  const k = keyFor(e.code); if (k) hold(k[0], k[1], e.code, true);
});
addEventListener('keyup', e => { const k = keyFor(e.code); if (k) hold(k[0], k[1], e.code, false); else if (held.has(e.code)) { const [s, a] = held.get(e.code); hold(s, a, e.code, false); } });
addEventListener('blur', () => { letGo(); if (inRace() && !G.paused) togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { letGo(); if (inRace() && !G.paused) togglePause(); } });
const hitRect = (q, r) => q.x >= r.x && q.x <= r.x + r.w && q.y >= r.y && q.y <= r.y + r.h;
// touch zones: one player gets left / middle / right thirds; in 2 player each half is split the same way
function zoneFor(x) {
  if (G.mode === '2p') { const side = x < ART_W / 2 ? 0 : 1, u = (x - side * ART_W / 2) / (ART_W / 2); return [side, u < 0.38 ? 'L' : u > 0.62 ? 'R' : 'F']; }
  return [0, x < ART_W * 0.36 ? 'L' : x > ART_W * 0.64 ? 'R' : 'F'];
}
cv.addEventListener('pointerdown', e => {
  G.sfx.init(); cv.focus();
  if (e.pointerType === 'touch') G.touch = true;
  const q = artXY(e);
  if (G.screen === 'how') { G.screen = 'title'; return; }
  if (G.screen === 'title') { MENU_ITEMS.forEach((m, i) => { if (hitRect(q, menuRect(i))) { G.sel = i; menuPick(i); } }); return; }
  if (G.paused) { togglePause(); return; }
  if (G.state === 'over') { overBtns().forEach((b, i) => { if (hitRect(q, { x: b.x, y: 132, w: b.w || 56, h: 20 })) { G.overSel = i; overPick(i); } }); return; }
  if (G.touch && q.x > 296 && q.y < 20) { togglePause(); return; }
  const [side, act] = zoneFor(q.x); hold(side, act, 'ptr' + e.pointerId, true);
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* already released */ }
});
const ptrUp = e => { const tk = 'ptr' + e.pointerId; if (held.has(tk)) { const [s, a] = held.get(tk); hold(s, a, tk, false); } };
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp);
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointermove', e => { if (G.screen !== 'title' || e.pointerType === 'touch') return; const q = artXY(e); MENU_ITEMS.forEach((m, i) => { if (hitRect(q, menuRect(i))) G.sel = i; }); });

// ---- customize panel
const menuEl = document.getElementById('menu');
let draft = null;
function chipsFor(box) {
  const k = box.dataset.pool; box.innerHTML = '';
  for (const it of POOLS[k]) { const b = document.createElement('button'); b.dataset.id = it.id; b.textContent = it.name; box.appendChild(b); }
}
menuEl.querySelectorAll('.chips').forEach(chipsFor);
function syncMenu() {
  menuEl.querySelectorAll('.seg').forEach(s => s.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(String(draft[s.dataset.key]) === b.dataset.v))));
  menuEl.querySelectorAll('.chips').forEach(c => c.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(draft.pools[c.dataset.pool].includes(b.dataset.id)))));
}
function openMenu() { draft = JSON.parse(JSON.stringify(SET)); G.menuOpen = true; letGo(); menuEl.hidden = false; syncMenu(); document.getElementById('done').focus(); }
function closeMenu() { Object.assign(SET, draft); saveSettings(SET); menuEl.hidden = true; G.menuOpen = false; G.sfx.setMuted(!!SET.muted); if (G.screen === 'title') G.newMatch('cvc', true); cv.focus(); }
menuEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'done') { closeMenu(); return; }
  const chips = b.closest('.chips'), seg = b.closest('.seg');
  if (chips) { const list = draft.pools[chips.dataset.pool], id = b.dataset.id, at = list.indexOf(id); if (at >= 0) { if (list.length > 1) list.splice(at, 1); } else list.push(id); }
  else if (seg) { const k = seg.dataset.key, v = b.dataset.v; draft[k] = typeof DEFAULTS[k] === 'number' ? +v : v; }
  G.sfx.click(); syncMenu();
});
menuEl.addEventListener('keydown', e => { if (e.code === 'Enter' && e.target.id === 'done') { e.preventDefault(); closeMenu(); } });
menuEl.addEventListener('pointerdown', e => { if (e.target === menuEl) closeMenu(); });

// ================================================================= loop
let last = performance.now(), acc = 0, broke = false;
function loop(now) {
  try {
    const rdt = Math.min(0.05, (now - last) / 1000); last = now; acc += rdt;
    let n = 0;
    while (acc >= STEP && n < 5) { G.sel = G.sel || 0; if (G.state === 'over') G.overT += STEP; if (!G.paused && !G.menuOpen && !G.freeze) G.step(STEP); acc -= STEP; n++; }   // (G.freeze: the ?debug harnesses step the sim themselves)
    if (n === 5) acc = 0;
    render(G);
  } catch (err) {
    if (!broke) { broke = true; errBox.hidden = false; errBox.textContent = 'Something broke: ' + (err && err.message || err) + ' (reload to keep playing)'; console.error(err); }
  }
  requestAnimationFrame(loop);
}
goTitle();
if (/[?&]debug\b/.test(location.search)) {
  window.floppy = G; window.floppySET = SET;
  window.floppyFn = { startMode, goTitle, hold, keyFor, openMenu, closeMenu, overPick, overBtns, render: () => render(G) };
  window.floppyStep = n => { for (let i = 0; i < n; i++) { if (G.state === 'over') G.overT += STEP; G.step(STEP); } render(G); };
}
requestAnimationFrame(loop);
cv.focus();
})();
