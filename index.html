<script>
(() => {
'use strict';

  { id: 'soccer', name: 'FLOPPY SOCCER', tag: 'RAGDOLL FOOTBALL', href: 'soccer.html', col: '#2f9a4a' },
  { id: 'volley', name: 'FLOPPY VOLLEY', tag: 'RAGDOLL VOLLEYBALL', href: 'volley.html', col: '#e0a32a' },

// four cards on top, three below (centred)

const DEV_HASH = 'bf7a138eb29900f8b7a65f3258f2cead5c5820b4a0fb32861c3508d97d2277fa';
let dev = false, toast = null;
try { dev = localStorage.getItem('floppy-dev') === '1'; } catch (e) { /* storage unavailable */ }
const devCode = new URLSearchParams(location.search).get('dev');
if (devCode && window.crypto && crypto.subtle) {
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(devCode)).then(b => {
    const hex = [...new Uint8Array(b)].map(v => v.toString(16).padStart(2, '0')).join('');

}
const canOpen = gm => !gm.wip || (dev && !gm.soon);
let S = 1, OX = 0, OY = 0, DPR = 1, sel = 0, t = 0, going = null, online = 0, frame = null;
try { sel = Math.max(0, GAMES.findIndex(g => g.id === localStorage.getItem('floppy-last-game'))); } catch (e) { /* storage unavailable */ }
function resize() {

  const gut = 16 * DPR;

const R = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(OX + x * S), Math.round(OY + y * S), Math.ceil(w * S), Math.ceil(h * S)); };
function txt(str, x, y, size, col, bold) {

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const px = OX + x * S, py = OY + y * S, o = Math.max(1, Math.round(S));
  ctx.fillStyle = INK; ctx.fillText(str, px, py + o * 2);

  ctx.fillStyle = col; ctx.fillText(str, px, py);
}
function ball(x, y, r, col, seam) {
  for (let yy = -r - 1; yy <= r + 1; yy++) for (let xx = -r - 1; xx <= r + 1; xx++) { const d = Math.hypot(xx + 0.5, yy + 0.5); if (d <= r + 1 && d > r) R(x + xx, y + yy, 1, 1, INK); else if (d <= r) R(x + xx, y + yy, 1, 1, seam && (Math.abs(xx + 0.5) < 0.6 || Math.abs(yy + 0.5) < 0.6) ? seam : col); }
}
// a stick-figure-ish floppy player: rigid body that rocks, one arm
function dude(x, y, lean, col, arm, paddle) {

function hoopsScene(x0, y0, k) {

function pongScene(x0, y0, k) {

function soccerScene(x0, y0, k) {
  R(x0, y0, CARD.w - 8, 36, '#a4aab5');

  R(gx - 1, gt, 4, gb - gt, INK); R(gx, gt + 1, 2, gb - gt - 2, '#ffffff');

  const p = (t * 0.5) % 1, sx = x0 + 26, sy = y0 + 52, ex = gx + 10, ey = gt + 8;
  const q = Math.min(1, p / 0.6), kick = p < 0.12;
  const bx = p < 0.6 ? sx + (ex - sx) * q : ex + Math.sin(p * 60) * (1 - p) * 2, by = p < 0.6 ? sy + (ey - sy) * q - Math.sin(q * Math.PI) * 18 : Math.min(gb - 3, ey + (p - 0.6) * 60);

function volleyScene(x0, y0, k) {

// a boxer: the dude with a glove on the end of the arm
function boxer(x, y, lean, col, arm, glove) {

function boxingScene(x0, y0, k) {
  R(x0, y0, CARD.w - 8, 60, '#3a2f3f');

// a sniper: the dude with a little rifle on the end of the arm

function construction(x0, y0) {
  R(x0, y0 + 44, CARD.w - 8, 16, INK);
  ctx.save(); ctx.beginPath(); ctx.rect(Math.round(OX + x0 * S), Math.round(OY + (y0 + 46) * S), Math.ceil((CARD.w - 8) * S), Math.ceil(12 * S)); ctx.clip();
  for (let i = -2; i < 16; i++) { ctx.fillStyle = '#ffd23a'; ctx.beginPath(); const bx = OX + (x0 + i * 10) * S, by = OY + (y0 + 46) * S; ctx.moveTo(bx, by + 12 * S); ctx.lineTo(bx + 5 * S, by + 12 * S); ctx.lineTo(bx + 17 * S, by); ctx.lineTo(bx + 12 * S, by); ctx.fill(); }
  ctx.restore();
  R(x0 + 10, y0 + 47, CARD.w - 28, 10, INK);
  txt('UNDER CONSTRUCTION', x0 + (CARD.w - 8) / 2, y0 + 52, 7, '#ffd23a', true);
}
function draw() {
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#0b0d14'; ctx.fillRect(0, 0, cv.width, cv.height);
  R(0, 0, ART_W, ART_H, '#161a29');
  for (let i = 0; i < 40; i++) { const x = (i * 83) % ART_W, y = (i * 47) % 60; if (Math.sin(t * 2 + i) > 0.3) R(x, y, 1, 1, '#3a4266'); }
  R(0, ART_H - 16, ART_W, 16, '#1f2436');
  if (online > 0) txt(`${online} ONLINE NOW`, ART_W / 2, ART_H - 8, 8, '#43f07a');
  txt('PICK A GAME', ART_W / 2, 22, 16, ORANGE, true);
  txt('ARROWS TO CHOOSE, ENTER TO PLAY', ART_W / 2, 38, 8, '#7d88a8');
  GAMES.forEach((gm, i) => {
    const on = i === sel, bob = on ? Math.round(Math.sin(t * 5) * 1.5) - 2 : 0, x = CARD.x[i], y = CARD.y[i] + bob;
    R(x - 2, y - 2, CARD.w + 4, CARD.h + 4, on ? ORANGE : INK); R(x, y, CARD.w, CARD.h, '#1b2031'); R(x, y + CARD.h - 3, CARD.w, 3, on ? '#c4621a' : '#12151f');
    R(x + 3, y + 3, CARD.w - 6, 62, INK);
    [hoopsScene, pongScene, soccerScene, volleyScene, boxingScene, snipersScene, getawayScene][i](x + 4, y + 4, on ? 1.4 : 0.6);
    if (gm.wip) construction(x + 4, y + 4);
    txt(gm.name, x + CARD.w / 2, y + 78, 8, on ? CREAM : '#b9c3dd', true);
    const tag = !gm.wip ? gm.tag : canOpen(gm) ? 'DEV PREVIEW' : 'COMING SOON';
    txt(tag, x + CARD.w / 2, y + 92, 8, gm.wip ? (on ? '#ffd23a' : '#8a7a3a') : on ? ORANGE : '#59627d');
  });
  if (toast) {
    const a = Math.min(1, toast.t * 6, (1.6 - toast.t) * 4);
    ctx.globalAlpha = Math.max(0, a);
    R(ART_W / 2 - 170, ART_H / 2 - 18, 340, 36, INK); R(ART_W / 2 - 168, ART_H / 2 - 16, 336, 32, '#2a2410');
    txt(toast.title, ART_W / 2, ART_H / 2 - 6, 10, '#ffd23a', true);
    txt('NOT PLAYABLE YET - COMING SOON', ART_W / 2, ART_H / 2 + 8, 7, CREAM);
    ctx.globalAlpha = 1;
  }
  if (going) { const a = Math.min(1, going.t / 0.35); ctx.fillStyle = `rgba(11,13,20,${a})`; ctx.fillRect(0, 0, cv.width, cv.height); }
}
function go(i) {
  if (going) return;
  sel = i;
  if (!canOpen(GAMES[i])) { toast = { t: 0, title: `${GAMES[i].name} IS UNDER CONSTRUCTION` }; return; }
  // the developer's frame is told it may open (the game page checks, since its storage may be off)
  const href = GAMES[i].href + (GAMES[i].wip ? '#dev' : '');
  going = { t: 0, href };
  try { localStorage.setItem('floppy-last-game', GAMES[i].id); } catch (e) { /* storage unavailable */ }
  setTimeout(() => { if (inArtifact) openFrame(href); else location.href = href; }, 350);
}
// Inside the Claude artifact the games run in a frame over this page, which keeps the room open for them and
// counts who's here. Anywhere else they're plain pages, and this page just counts.
const inArtifact = !!(window.claude && window.FloppyNet);
if (window.FloppyNet) {
  const roomP = FloppyNet.room();
  if (inArtifact) FloppyNet.serveFrames(roomP);
  roomP.then(room => {
    if (!room) return;
    const count = ps => { online = ps.filter(p => p.kind !== 'agent').length; };
    try { count(room.peers()); } catch (e) { /* not connected yet */ }
    room.onPeers(ch => count(ch.peers), () => {});
  });
}
if (inArtifact) {
  addEventListener('message', e => { if (frame && e.source === frame.contentWindow && e.data && e.data.fnet === 'home') closeFrame(); });
}
function openFrame(href) {
  frame = document.createElement('iframe');
  frame.id = 'game'; frame.title = GAMES[sel].name; frame.allow = 'fullscreen; autoplay';
  // a game that sends itself back to the picker lands here instead of nesting a second picker
  frame.addEventListener('load', () => {
    let home = false;
    try { home = !!frame.contentDocument.getElementById('pick'); } catch (e) { /* not ours to read */ }
    if (home) closeFrame(); else try { frame.contentWindow.focus(); } catch (e) { /* fine */ }
  });
  frame.src = href;
  document.body.appendChild(frame);
}
function closeFrame() {
  if (!frame) return;
  frame.remove(); frame = null; going = null;
  last = performance.now(); requestAnimationFrame(loop); cv.focus();
}
let last = performance.now();
function loop(now) {
  if (frame) return;   // a game has the screen; it restarts us when it closes
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  if (going) going.t += dt;
  if (toast && (toast.t += dt) > 1.6) toast = null;
  draw(); requestAnimationFrame(loop);
}
window.addEventListener('resize', resize);
window.addEventListener('keydown', e => {
  if (frame) return;
  const c = e.code;
  // left/right step through the cards; up/down hop to the nearest card in the other row
  const hopRow = up => {
    const row = GAMES.map((g, i) => i).filter(i => up ? CARD.y[i] < CARD.y[sel] : CARD.y[i] > CARD.y[sel]);
    if (row.length) sel = row.reduce((b, i) => Math.abs(CARD.x[i] - CARD.x[sel]) < Math.abs(CARD.x[b] - CARD.x[sel]) ? i : b);
  };
  if (['ArrowLeft', 'KeyA', 'KeyW', 'KeyI'].includes(c)) { sel = (sel + GAMES.length - 1) % GAMES.length; e.preventDefault(); }
  else if (['ArrowRight', 'KeyD', 'KeyE', 'KeyO'].includes(c)) { sel = (sel + 1) % GAMES.length; e.preventDefault(); }
  else if (c === 'ArrowDown' || c === 'KeyS') { hopRow(false); e.preventDefault(); }
  else if (c === 'ArrowUp') { hopRow(true); e.preventDefault(); }
  else if (c === 'Enter' || c === 'Space') { e.preventDefault(); go(sel); }
});
function cardAt(e) {
  const r = cv.getBoundingClientRect(), x = ((e.clientX - r.left) * DPR - OX) / S, y = ((e.clientY - r.top) * DPR - OY) / S;
  return CARD.x.findIndex((cx, i) => x >= cx - 2 && x <= cx + CARD.w + 2 && y >= CARD.y[i] - 4 && y <= CARD.y[i] + CARD.h + 2);
}
cv.addEventListener('pointermove', e => { const i = cardAt(e); if (i >= 0) sel = i; cv.style.cursor = i >= 0 ? 'pointer' : ''; });
cv.addEventListener('pointerdown', e => { const i = cardAt(e); if (i >= 0) go(i); });
resize(); cv.focus();
requestAnimationFrame(loop);
})();
</script>
