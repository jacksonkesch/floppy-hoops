<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0b0d14">
<title>Floppy Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: #0b0d14; overflow: hidden; }
  #pick { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<canvas id="pick" tabindex="0" aria-label="Pick a game: Floppy Hoops, Pong, Soccer, Volley or Boxing. Arrows to choose, Enter to play."></canvas>
<nav class="sr"><a href="hoops.html">Play Floppy Hoops</a> <a href="pong.html">Play Floppy Pong</a> <a href="soccer.html">Play Floppy Soccer</a> <a href="volley.html">Play Floppy Volley</a> <a href="boxing.html">Play Floppy Boxing</a></nav>
<script>
(() => {
'use strict';
// The game picker: five cards (three on top, two below), each with a little looping scene. Arrows (or A/D, W/E, I/O) choose, Enter plays.
const cv = document.getElementById('pick'), ctx = cv.getContext('2d');
const ART_W = 440, ART_H = 290, INK = '#141019', CREAM = '#fff6e0', ORANGE = '#ff8a2a';
const GAMES = [
  { id: 'hoops', name: 'FLOPPY HOOPS', tag: 'RAGDOLL BASKETBALL', href: 'hoops.html', col: '#d93a3f' },
  { id: 'pong', name: 'FLOPPY PONG', tag: 'RAGDOLL PING PONG', href: 'pong.html', col: '#2f6bd8' },
  { id: 'soccer', name: 'FLOPPY SOCCER', tag: 'RAGDOLL FOOTBALL', href: 'soccer.html', col: '#2f9a4a' },
  { id: 'volley', name: 'FLOPPY VOLLEY', tag: 'RAGDOLL VOLLEYBALL', href: 'volley.html', col: '#e0a32a' },
  { id: 'boxing', name: 'FLOPPY BOXING', tag: 'RAGDOLL BOXING', href: 'boxing.html', col: '#b8323a' },
];
const CARD = { w: 128, h: 104, x: [16, 156, 296, 86, 226], y: [52, 52, 52, 170, 170] };
let S = 1, OX = 0, OY = 0, DPR = 1, sel = 0, t = 0, going = null;
try { sel = Math.max(0, GAMES.findIndex(g => g.id === localStorage.getItem('floppy-last-game'))); } catch (e) { /* storage unavailable */ }
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(cv.clientWidth * DPR); cv.height = Math.round(cv.clientHeight * DPR);
  const gut = 16 * DPR;
  S = Math.max(0.5, Math.min((cv.width - 2 * gut) / ART_W, (cv.height - 2 * gut) / ART_H));
  OX = Math.round((cv.width - ART_W * S) / 2); OY = Math.round((cv.height - ART_H * S) / 2);
}
const R = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(OX + x * S), Math.round(OY + y * S), Math.ceil(w * S), Math.ceil(h * S)); };
function txt(str, x, y, size, col, bold) {
  ctx.font = `${bold ? 700 : 400} ${Math.max(7, Math.round(size * S))}px Silkscreen, "Courier New", monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const px = OX + x * S, py = OY + y * S, o = Math.max(1, Math.round(S));
  ctx.fillStyle = INK; ctx.fillText(str, px, py + o * 2);
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) if (dx || dy) ctx.fillText(str, px + dx * o, py + dy * o);
  ctx.fillStyle = col; ctx.fillText(str, px, py);
}
function ball(x, y, r, col, seam) {
  for (let yy = -r - 1; yy <= r + 1; yy++) for (let xx = -r - 1; xx <= r + 1; xx++) { const d = Math.hypot(xx + 0.5, yy + 0.5); if (d <= r + 1 && d > r) R(x + xx, y + yy, 1, 1, INK); else if (d <= r) R(x + xx, y + yy, 1, 1, seam && (Math.abs(xx + 0.5) < 0.6 || Math.abs(yy + 0.5) < 0.6) ? seam : col); }
}
// a stick-figure-ish floppy player: rigid body that rocks, one arm
function dude(x, y, lean, col, arm, paddle) {
  ctx.save(); ctx.translate(OX + x * S, OY + y * S); ctx.rotate(lean);
  const P = (px, py, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(px * S), Math.round(py * S), Math.ceil(w * S), Math.ceil(h * S)); };
  P(-4, -20, 8, 20, INK); P(-3, -19, 6, 7, '#1c1c24'); P(-3, -12, 6, 11, '#e2ad84');
  P(-5, -38, 10, 19, INK); P(-4, -37, 8, 17, col);
  P(-5, -47, 10, 10, INK); P(-4, -46, 8, 8, '#e2ad84'); P(-4, -47, 8, 3, '#231812'); P(1, -43, 1, 1, INK);
  ctx.save(); ctx.translate(0, -34 * S); ctx.rotate(-arm);
  P(-2, 0, 4, 17, INK); P(-1, 0, 2, 16, '#e2ad84');
  if (paddle) { P(-1, 16, 2, 3, '#c08a4f'); P(-4, 19, 8, 8, INK); P(-3, 20, 6, 6, paddle); }
  ctx.restore(); ctx.restore();
}
function hoopsScene(x0, y0, k) {
  R(x0, y0, CARD.w - 8, 60, '#a4aab5'); R(x0, y0 + 36, CARD.w - 8, 24, '#dcb57d'); R(x0, y0 + 36, CARD.w - 8, 1, '#a57a47');
  for (let i = 0; i < 9; i++) R(x0 + 4 + i * 13, y0 + 22, 6, 6, ['#7f8aa3', '#9a7f7f', '#86977f', '#a29579'][i % 4]);
  const bx = x0 + 96, by = y0 + 14;
  R(bx + 16, by - 12, 3, 48, INK); R(bx + 17, by - 11, 1, 46, '#6a717d');
  R(bx + 12, by - 8, 3, 18, INK); R(bx + 13, by - 7, 1, 16, '#f3f5fa');
  R(bx - 2, by + 2, 15, 2, '#b8420f');
  for (let i = 0; i < 5; i++) R(bx - 1 + i * 3, by + 4, 1, 6, '#ffffff');
  // a jump shot on a loop: the ball arcs from the player to the hoop and drops through
  const p = (t * 0.55) % 1, sx = x0 + 22, sy = y0 + 22;
  const bxp = p < 0.7 ? sx + (bx + 5 - sx) * (p / 0.7) : bx + 5, byp = p < 0.7 ? sy - Math.sin(p / 0.7 * Math.PI) * 26 + ((by - 2) - sy) * (p / 0.7) : by - 2 + (p - 0.7) / 0.3 * 34;
  const jump = p < 0.2 ? Math.sin(p / 0.2 * Math.PI) * 6 : 0;
  dude(x0 + 20, y0 + 56 - jump, Math.sin(t * 3) * 0.12 * k, '#d93a3f', p < 0.15 ? 2.6 : 0.4 + Math.sin(t * 3) * 0.2, null);
  ball(Math.round(bxp), Math.round(byp), 3, '#ec7a2f', '#43200e');
}
function pongScene(x0, y0, k) {
  R(x0, y0, CARD.w - 8, 60, '#a4aab5'); R(x0, y0 + 36, CARD.w - 8, 24, '#dcb57d'); R(x0, y0 + 36, CARD.w - 8, 1, '#a57a47');
  const tx0 = x0 + 28, tx1 = x0 + 92, ty = y0 + 40;
  R(tx0, ty - 2, tx1 - tx0, 1, '#e9eef7'); R(tx0, ty - 1, tx1 - tx0, 2, '#2f6fbf'); R(tx0, ty + 1, tx1 - tx0, 1, '#f4f6fb'); R(tx0, ty + 2, tx1 - tx0, 2, '#1c3f73');
  R(tx0 + 6, ty + 4, 2, 12, '#4a5063'); R(tx1 - 8, ty + 4, 2, 12, '#4a5063');
  const nx = (tx0 + tx1) / 2; R(nx - 1, ty - 9, 3, 7, INK); R(nx, ty - 8, 1, 6, '#c9ced8');
  // a rally on a loop: bounce on each side, paddles swing as it arrives
  const p = (t * 0.7) % 2, half = p < 1 ? p : p - 1, fwd = p < 1;
  const xa = x0 + 16, xb = x0 + 104, bx = fwd ? xa + (xb - xa) * half : xb - (xb - xa) * half;
  const hop = Math.abs(Math.sin(half * Math.PI * 2)) * 16, by = ty - 4 - hop;
  dude(x0 + 8, y0 + 56, Math.sin(t * 3) * 0.1 * k, '#d93a3f', !fwd && half > 0.8 ? 2.4 : 1.1, '#d8383c');
  ctx.save(); ctx.translate(OX + (x0 + 112) * S, 0); ctx.scale(-1, 1); ctx.translate(-(OX + (x0 + 112) * S), 0);
  dude(x0 + 112, y0 + 56, Math.sin(t * 3 + 1) * 0.1 * k, '#2f6bd8', fwd && half > 0.8 ? 2.4 : 1.1, '#2b2b36');
  ctx.restore();
  ball(Math.round(bx), Math.round(by), 2, '#ffffff');
}
function soccerScene(x0, y0, k) {
  R(x0, y0, CARD.w - 8, 36, '#a4aab5');
  R(x0, y0 + 36, CARD.w - 8, 24, '#3b7a2a');
  for (let i = 0; i < 6; i++) R(x0 + 4 + i * 20, y0 + 36, 10, 24, '#4c8c39');
  // goal at the right edge: crossbar, post and net
  const gx = x0 + 100, gt = y0 + 22, gb = y0 + 44;
  for (let i = 0; i < 4; i++) R(gx + 4 + i * 4, gt + 2, 1, gb - gt - 2, '#c9d2c9');
  for (let j = 0; j < 5; j++) R(gx + 2, gt + 3 + j * 4, 16, 1, '#c9d2c9');
  R(gx - 1, gt - 1, 21, 4, INK); R(gx, gt, 19, 2, '#ffffff');
  R(gx - 1, gt, 4, gb - gt, INK); R(gx, gt + 1, 2, gb - gt - 2, '#ffffff');
  // a shot on a loop: kick, the ball curls in over the diving goalie, the net shakes, reset
  const p = (t * 0.5) % 1, sx = x0 + 26, sy = y0 + 52, ex = gx + 10, ey = gt + 8;
  const q = Math.min(1, p / 0.6), kick = p < 0.12;
  const bx = p < 0.6 ? sx + (ex - sx) * q : ex + Math.sin(p * 60) * (1 - p) * 2, by = p < 0.6 ? sy + (ey - sy) * q - Math.sin(q * Math.PI) * 18 : Math.min(gb - 3, ey + (p - 0.6) * 60);
  dude(x0 + 18, y0 + 56, (kick ? -0.35 : Math.sin(t * 3) * 0.1) * k, '#d93a3f', 0.5 + Math.sin(t * 3) * 0.2, null);
  const dive = q > 0.5 && p < 0.8 ? Math.sin((q - 0.5) * Math.PI) * 10 : 0;
  ctx.save(); ctx.translate(OX + (x0 + 92) * S, 0); ctx.scale(-1, 1); ctx.translate(-(OX + (x0 + 92) * S), 0);
  dude(x0 + 92, y0 + 56 - Math.round(dive), Math.sin(t * 3 + 1) * 0.1 * k - dive * 0.04, '#2f6bd8', dive ? 2.8 : 1.2, null);
  ctx.restore();
  ball(Math.round(bx), Math.round(by), 3, '#ffffff', '#222');
}
function volleyScene(x0, y0, k) {
  R(x0, y0, CARD.w - 8, 36, '#7fb8e0');
  R(x0 + 88, y0 + 6, 12, 12, '#ffe07a');
  R(x0, y0 + 36, CARD.w - 8, 24, '#e8cf8f');
  const nx = x0 + 60, top = y0 + 26, bot = y0 + 44;
  R(nx - 1, top - 1, 3, bot - top + 12, INK); R(nx, top, 1, bot - top + 10, '#8b5a2b');
  for (let j = 0; j < 4; j++) R(nx - 3, top + 3 + j * 3, 7, 1, '#f4f6fb');
  R(nx - 4, top - 1, 9, 3, '#ffffff');
  // the ball lobs over the net on a loop; the side it's arriving at jumps to meet it
  const p = (t * 0.6) % 2, half = p < 1 ? p : p - 1, fwd = p < 1;
  const xa = x0 + 22, xb = x0 + 98, bx = fwd ? xa + (xb - xa) * half : xb - (xb - xa) * half;
  const by = y0 + 18 - Math.sin(half * Math.PI) * 14;
  const jumpR = !fwd && half > 0.75 ? Math.sin((half - 0.75) / 0.25 * Math.PI) * 8 : (fwd && half < 0.2 ? Math.sin((0.2 - half) / 0.2 * Math.PI) * 8 : 0);
  const jumpB = fwd && half > 0.75 ? Math.sin((half - 0.75) / 0.25 * Math.PI) * 8 : (!fwd && half < 0.2 ? Math.sin((0.2 - half) / 0.2 * Math.PI) * 8 : 0);
  dude(x0 + 20, y0 + 56 - Math.round(jumpR), Math.sin(t * 3) * 0.1 * k, '#d93a3f', jumpR ? 2.8 : 0.6, null);
  ctx.save(); ctx.translate(OX + (x0 + 100) * S, 0); ctx.scale(-1, 1); ctx.translate(-(OX + (x0 + 100) * S), 0);
  dude(x0 + 100, y0 + 56 - Math.round(jumpB), Math.sin(t * 3 + 1) * 0.1 * k, '#2f6bd8', jumpB ? 2.8 : 0.6, null);
  ctx.restore();
  ball(Math.round(bx), Math.round(by), 3, '#ffd23a', '#2f6bd8');
}
// a boxer: the dude with a glove on the end of the arm
function boxer(x, y, lean, col, arm, glove) {
  dude(x, y, lean, col, arm, null);
  ctx.save(); ctx.translate(OX + x * S, OY + y * S); ctx.rotate(lean); ctx.translate(0, -34 * S); ctx.rotate(-arm);
  ctx.fillStyle = INK; ctx.fillRect(Math.round(-4 * S), Math.round(14 * S), Math.ceil(8 * S), Math.ceil(8 * S));
  ctx.fillStyle = glove; ctx.fillRect(Math.round(-3 * S), Math.round(15 * S), Math.ceil(6 * S), Math.ceil(6 * S));
  ctx.restore();
}
function boxingScene(x0, y0, k) {
  R(x0, y0, CARD.w - 8, 60, '#3a2f3f');
  for (let i = 0; i < 24; i++) R(x0 + 3 + (i * 37) % 114, y0 + 3 + (i * 13) % 12, 2, 2, ['#5a4a60', '#6b5570', '#4d4257'][i % 3]);
  R(x0, y0 + 42, CARD.w - 8, 18, '#3b6fb0'); R(x0, y0 + 42, CARD.w - 8, 1, '#5d8fd0');
  R(x0 + 4, y0 + 16, 3, 28, INK); R(x0 + 113, y0 + 16, 3, 28, INK);
  // alternating jabs on a loop; the one who gets hit rocks back and sees stars
  const p = (t * 0.9) % 2, redTurn = p < 1, h = redTurn ? p : p - 1, swing = h < 0.35 ? Math.sin(h / 0.35 * Math.PI / 2) : Math.max(0, 1 - (h - 0.35) / 0.4);
  const hit = h > 0.3 && h < 0.6, rock = hit ? 0.25 * k : 0;
  const redArm = redTurn ? 0.6 + swing * 1.0 : 0.6, blueArm = redTurn ? 0.6 : 0.6 + swing * 1.0;
  boxer(x0 + 44 + (redTurn ? swing * 4 : -rock * 12), y0 + 56, (redTurn ? 0.15 * swing : -rock) + Math.sin(t * 4) * 0.05 * k, '#d93a3f', redArm, '#e03a3a');
  ctx.save(); ctx.translate(OX + (x0 + 76) * S, 0); ctx.scale(-1, 1); ctx.translate(-(OX + (x0 + 76) * S), 0);
  boxer(x0 + 76 - (redTurn ? rock * 12 : -swing * 4), y0 + 56, (redTurn ? -rock : 0.15 * swing) + Math.sin(t * 4 + 1) * 0.05 * k, '#2f6bd8', blueArm, '#2f6bd8');
  ctx.restore();
  for (let i = 0; i < 3; i++) R(x0 + 7, y0 + 20 + i * 7, 106, 2, '#d93a3f');
  if (hit) { const sx = redTurn ? x0 + 80 : x0 + 40, sy = y0 + 12; R(sx - 3, sy, 7, 1, '#ffdd00'); R(sx, sy - 3, 1, 7, '#ffdd00'); R(sx - 2, sy - 2, 1, 1, '#fff6a0'); R(sx + 2, sy + 2, 1, 1, '#fff6a0'); }
}
function draw() {
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#0b0d14'; ctx.fillRect(0, 0, cv.width, cv.height);
  R(0, 0, ART_W, ART_H, '#161a29');
  for (let i = 0; i < 40; i++) { const x = (i * 83) % ART_W, y = (i * 47) % 60; if (Math.sin(t * 2 + i) > 0.3) R(x, y, 1, 1, '#3a4266'); }
  R(0, ART_H - 16, ART_W, 16, '#1f2436');
  txt('PICK A GAME', ART_W / 2, 22, 16, ORANGE, true);
  txt('ARROWS TO CHOOSE, ENTER TO PLAY', ART_W / 2, 38, 8, '#7d88a8');
  GAMES.forEach((gm, i) => {
    const on = i === sel, bob = on ? Math.round(Math.sin(t * 5) * 1.5) - 2 : 0, x = CARD.x[i], y = CARD.y[i] + bob;
    R(x - 2, y - 2, CARD.w + 4, CARD.h + 4, on ? ORANGE : INK); R(x, y, CARD.w, CARD.h, '#1b2031'); R(x, y + CARD.h - 3, CARD.w, 3, on ? '#c4621a' : '#12151f');
    R(x + 3, y + 3, CARD.w - 6, 62, INK);
    [hoopsScene, pongScene, soccerScene, volleyScene, boxingScene][i](x + 4, y + 4, on ? 1.4 : 0.6);
    txt(gm.name, x + CARD.w / 2, y + 78, 8, on ? CREAM : '#b9c3dd', true);
    txt(gm.tag, x + CARD.w / 2, y + 92, 8, on ? ORANGE : '#59627d');
  });
  if (going) { const a = Math.min(1, going.t / 0.35); ctx.fillStyle = `rgba(11,13,20,${a})`; ctx.fillRect(0, 0, cv.width, cv.height); }
}
function go(i) {
  if (going) return;
  sel = i; going = { t: 0, href: GAMES[i].href };
  try { localStorage.setItem('floppy-last-game', GAMES[i].id); } catch (e) { /* storage unavailable */ }
  setTimeout(() => { location.href = GAMES[i].href; }, 350);
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  if (going) going.t += dt;
  draw(); requestAnimationFrame(loop);
}
window.addEventListener('resize', resize);
window.addEventListener('keydown', e => {
  const c = e.code;
  // left/right step through the cards; up/down hop between the rows (top 0-2, bottom 3-4)
  if (['ArrowLeft', 'KeyA', 'KeyW', 'KeyI'].includes(c)) { sel = (sel + GAMES.length - 1) % GAMES.length; e.preventDefault(); }
  else if (['ArrowRight', 'KeyD', 'KeyE', 'KeyO'].includes(c)) { sel = (sel + 1) % GAMES.length; e.preventDefault(); }
  else if (c === 'ArrowDown' || c === 'KeyS') { sel = [3, 3, 4, 3, 4][sel]; e.preventDefault(); }
  else if (c === 'ArrowUp') { sel = [0, 1, 2, 0, 2][sel]; e.preventDefault(); }
  else if (c === 'Enter' || c === 'Space') { e.preventDefault(); go(sel); }
});
function cardAt(e) {
  const r = cv.getBoundingClientRect(), x = ((e.clientX - r.left) * DPR - OX) / S, y = ((e.clientY - r.top) * DPR - OY) / S;
  return CARD.x.findIndex((cx, i) => x >= cx - 2 && x <= cx + CARD.w + 2 && y >= CARD.y[i] - 4 && y <= CARD.y[i] + CARD.h + 2);
}
cv.addEventListener('pointermove', e => { const i = cardAt(e); if (i >= 0) sel = i; cv.style.cursor = i >= 0 ? 'pointer' : ''; });
cv.addEventListener('pointerdown', e => { const i = cardAt(e); if (i >= 0) go(i); });
resize(); cv.focus();
requestAnimationFrame(loop);
})();
</script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
